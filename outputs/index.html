<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Post Studio · 社交内容模拟器</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Noto+Sans+SC:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <header class="topbar">
    <div class="brand-mark" aria-hidden="true"><span></span><span></span><span></span></div>
    <div class="brand-copy"><strong>post studio</strong><span>社交内容模拟器</span></div>
    <div class="topbar-actions">
      <button class="ghost-button" id="resetButton" type="button">重置</button>
      <button class="primary-button" id="exportButton" type="button"><span class="button-icon">↓</span>保存图片</button>
    </div>
  </header>
  <main class="app-shell">
    <aside class="control-panel">
      <div class="panel-heading">
        <div><p class="eyebrow">CREATE</p><h1>做一张<br><em>想发的图</em></h1></div>
        <span class="status-dot" title="实时预览已开启"></span>
      </div>
      <div class="field-group">
        <label>模拟器</label>
        <div class="segmented" role="tablist" aria-label="模拟器选择">
          <button class="platform-tab active" data-platform="x" role="tab" type="button">X / Twitter</button>
          <button class="platform-tab" data-platform="threads" role="tab" type="button">Threads</button>
          <button class="platform-tab" data-platform="note" role="tab" type="button">极简长文</button>
        </div>
      </div>
      <div class="field-group">
        <label for="displayName">显示名称</label>
        <input id="displayName" value="林默" maxlength="28" />
        <div class="handle-row"><input id="handle" value="linmo.notes" maxlength="28" /><span>用户名</span></div>
      </div>
      <div class="field-group">
        <label for="content">正文 <span class="counter" id="charCount">0 / 280</span></label>
        <textarea id="content" maxlength="560" rows="7">真正让人变强的，不是某一次“开窍”，而是你愿意在没人看见的时候，把一件小事重复很多遍。

慢一点没关系。稳定地向前，已经是很稀缺的能力。</textarea>
        <div class="quick-chips"><button type="button" data-insert="✦ ">✦ 加符号</button><button type="button" data-insert="\n\n# 记录一下"># 加话题</button><button type="button" data-insert="\n\n—— 林默">署名</button></div>
      </div>
      <div class="field-row">
        <div class="field-group compact"><label for="dateText">日期</label><input id="dateText" value="10月27日 · 21:16" maxlength="26" /></div>
        <div class="field-group compact"><label for="locationText">地点</label><input id="locationText" value="杭州" maxlength="14" /></div>
      </div>
      <div class="field-group">
        <div class="label-line"><label>互动数据</label><button class="link-button" id="toggleStats" type="button">隐藏</button></div>
        <div class="stats-grid" id="statsGrid">
          <input id="replies" value="24" aria-label="回复数" /><input id="reposts" value="86" aria-label="转发数" /><input id="likes" value="1,248" aria-label="喜欢数" />
        </div>
      </div>
      <div class="field-group">
        <div class="label-line"><label>视觉风格</label><span class="muted">实时生效</span></div>
        <div class="swatches" role="radiogroup" aria-label="视觉风格">
          <button class="swatch active" data-theme="paper" aria-label="纸张白" type="button"></button>
          <button class="swatch ink" data-theme="ink" aria-label="墨黑" type="button"></button>
          <button class="swatch blush" data-theme="blush" aria-label="浅粉" type="button"></button>
          <button class="swatch mint" data-theme="mint" aria-label="薄荷绿" type="button"></button>
        </div>
      </div>
      <div class="tip"><span class="tip-star">✦</span><span>拖动右侧预览区域也可以调整画布位置</span></div>
    </aside>
    <section class="preview-stage">
      <div class="stage-toolbar">
        <div class="stage-label"><span class="live-pulse"></span><span id="platformLabel">X / Twitter</span><small>LIVE PREVIEW</small></div>
        <div class="zoom-controls"><button id="zoomOut" type="button" aria-label="缩小">−</button><span id="zoomValue">100%</span><button id="zoomIn" type="button" aria-label="放大">＋</button></div>
      </div>
      <div class="preview-viewport" id="previewViewport">
        <div class="canvas-wrap" id="canvasWrap">
          <article class="social-card theme-paper platform-x" id="socialCard">
            <div class="card-topline"><span id="platformGlyph" class="platform-glyph">𝕏</span><span class="card-menu">•••</span></div>
            <div class="profile-row">
              <div class="avatar" id="avatar">林</div>
              <div class="profile-meta"><strong id="previewName">林默</strong><span>@<span id="previewHandle">linmo.notes</span></span></div>
              <button class="follow-button" type="button">关注</button>
            </div>
            <div class="post-copy" id="previewContent"></div>
            <div class="post-meta"><span id="previewDate">10月27日 · 21:16</span><span class="meta-separator">·</span><span id="previewLocation">杭州</span><span class="meta-separator">·</span><span id="platformMeta">来自 X</span></div>
            <div class="post-rule"></div>
            <div class="engagement" id="engagement">
              <span><i class="icon">○</i><b id="previewReplies">24</b></span><span><i class="icon">↗</i><b id="previewReposts">86</b></span><span><i class="icon heart">♡</i><b id="previewLikes">1,248</b></span><span><i class="icon">⌁</i></span>
            </div>
          </article>
        </div>
      </div>
      <div class="stage-footer"><span>1080 × 1350</span><span>适合小红书 / 朋友圈配图</span></div>
    </section>
  </main>
  <div class="toast" id="toast" role="status">预览已复制到剪贴板</div>
  <script src="https://cdn.jsdelivr.net/npm/html2canvas@1.4.1/dist/html2canvas.min.js"></script>
  <script src="app.js"></script>
</body>
</html>
