<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Post Studio · 社交内容模拟器</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Noto+Sans+SC:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <header class="topbar">
    <div class="brand-mark" aria-hidden="true"><span></span><span></span><span></span></div>
    <div class="brand-copy"><strong>post studio</strong><span>社交内容模拟器</span></div>
    <div class="topbar-actions">
      <button class="ghost-button" id="resetButton" type="button">重置</button>
      <button class="primary-button" id="exportButton" type="button"><span class="button-icon">↓</span>保存图片</button>
    </div>
  </header>
  <main class="app-shell">
    <aside class="control-panel">
      <div class="panel-heading">
        <div><p class="eyebrow">CREATE</p><h1>做一张<br><em>想发的图</em></h1></div>
        <span class="status-dot" title="实时预览已开启"></span>
      </div>
      <div class="field-group">
        <label>界面模板</label>
        <div class="segmented" role="tablist" aria-label="界面模板选择">
          <button class="platform-tab active" data-platform="x" role="tab" type="button">X 帖子</button>
          <button class="platform-tab" data-platform="threads" role="tab" type="button">Threads 串文</button>
        </div>
      </div>
      <div class="field-group">
        <label for="displayName">显示名称</label>
        <input id="displayName" value="空想泡芙" maxlength="28" />
        <div class="handle-row"><input id="handle" value="floppetharyn" maxlength="28" /><span>用户名</span></div>
      </div>
      <div class="field-group">
        <label for="avatarInput">头像</label>
        <div class="file-row"><input id="avatarInput" type="file" accept="image/*" /><button id="clearAvatar" class="mini-button" type="button">清除</button></div>
      </div>
      <div class="field-group">
        <label for="content">正文 <span class="counter" id="charCount">0 / 280</span></label>
        <textarea id="content" maxlength="1000" rows="8" placeholder="输入正文，画布会自动排版"></textarea>
        <div class="quick-chips"><button type="button" data-insert="✦ ">✦ 加符号</button><button type="button" data-insert="\n\n# 记录一下"># 加话题</button><button type="button" data-insert="\n\n—— 林默">署名</button></div>
      </div>
      <div class="field-row">
        <div class="field-group compact"><label for="dateText">日期 / 时间</label><input id="dateText" value="16:31 · 2026/10/16" maxlength="30" /></div>
        <div class="field-group compact"><label for="viewText">浏览量</label><input id="viewText" value="0 次查看" maxlength="20" /></div>
      </div>
      <div class="field-group threads-only-field">
        <label for="threadTitleInput">Threads 页面标题 / 时间</label>
        <div class="field-row"><input id="threadTitleInput" value="串文" maxlength="12" /><input id="threadAgeInput" value="2 小时" maxlength="12" /></div>
      </div>
      <div class="field-group">
        <div class="label-line"><label>互动数据</label><button class="link-button" id="toggleStats" type="button">隐藏</button></div>
        <div class="stats-grid" id="statsGrid">
          <input id="likes" value="0" aria-label="喜欢数" /><input id="replies" value="0" aria-label="回复数" /><input id="reposts" value="0" aria-label="转发数" /><input id="shares" value="0" aria-label="分享数" />
        </div>
      </div>
      <div class="field-group threads-only-field">
        <label for="threadViewText">Threads 浏览量</label>
        <input id="threadViewText" value="0 次观看" maxlength="20" />
      </div>
      <div class="field-group">
        <div class="label-line"><label>视觉风格</label><span class="muted">实时生效</span></div>
        <div class="swatches" role="radiogroup" aria-label="视觉风格">
          <button class="swatch active" data-theme="paper" aria-label="纸张白" type="button"></button>
          <button class="swatch ink" data-theme="ink" aria-label="墨黑" type="button"></button>
          <button class="swatch blush" data-theme="blush" aria-label="浅粉" type="button"></button>
          <button class="swatch mint" data-theme="mint" aria-label="薄荷绿" type="button"></button>
        </div>
      </div>
      <div class="tip"><span class="tip-star">✦</span><span>预览会按照真实手机页面比例导出图片</span></div>
    </aside>
    <section class="preview-stage">
      <div class="stage-toolbar">
        <div class="stage-label"><span class="live-pulse"></span><span id="platformLabel">X 帖子</span><small>LIVE PREVIEW</small></div>
        <div class="zoom-controls"><button id="zoomOut" type="button" aria-label="缩小">−</button><span id="zoomValue">100%</span><button id="zoomIn" type="button" aria-label="放大">＋</button></div>
      </div>
      <div class="preview-viewport" id="previewViewport">
        <div class="canvas-wrap" id="canvasWrap">
          <article class="phone-card theme-paper platform-x" id="socialCard">
            <div class="x-screen" id="xScreen">
              <div class="x-header"><i data-lucide="arrow-left"></i><strong>帖子</strong><i data-lucide="more-horizontal"></i></div>
              <div class="x-profile">
                <div class="phone-avatar"><img id="avatarImageX" alt="" /><span id="avatarFallbackX">李</span></div>
                <div class="phone-profile-meta"><strong id="previewNameX">李见</strong><span>@<span id="previewHandleX">ordnorii</span></span></div>
                <span class="x-logo">𝕏.com</span>
              </div>
              <div class="x-copy" id="previewContentX"></div>
              <div class="x-meta"><span id="previewDateX">12:42 · 2026/10/19</span><span>·</span><b id="previewViewX">1 次查看</b></div>
              <div class="x-actions" id="xActions"><span><i data-lucide="message-circle"></i></span><span><i data-lucide="repeat-2"></i></span><span><i data-lucide="heart"></i></span><span><i data-lucide="bookmark"></i></span><span><i data-lucide="share"></i></span></div>
            </div>
            <div class="threads-screen" id="threadsScreen">
              <div class="threads-status"><span>7:37</span><span class="status-icons"><em>VPN</em><span class="signal-group">5GA<i data-lucide="signal-high"></i></span><span class="signal-group">5G<i data-lucide="signal-high"></i></span><i data-lucide="wifi"></i><b>85</b><i data-lucide="zap"></i></span></div>
              <div class="threads-header"><button class="icon-button back-button" type="button" aria-label="返回"><i data-lucide="arrow-left"></i></button><div><strong id="threadTitle">串文</strong><span id="threadViews">697 次观看　›</span></div><div class="header-icons"><i data-lucide="bell-ring"></i><i data-lucide="more-horizontal"></i></div></div>
              <div class="thread-profile">
                <div class="phone-avatar"><img id="avatarImageT" alt="" /><span id="avatarFallbackT">李</span></div>
                <div><strong id="previewNameT">convallaria_01</strong><span id="threadAge">2 小时</span></div>
              </div>
              <div class="thread-copy" id="previewContentT"></div>
              <div class="thread-actions" id="threadActions"><span><i data-lucide="heart"></i></span><span><i data-lucide="message-circle"></i></span><span><i data-lucide="repeat-2"></i></span><span><i data-lucide="send"></i></span><span><i data-lucide="chart-no-axes-column-increasing"></i></span></div>
              <div class="thread-divider"></div><div class="thread-dynamics">查看动态　›</div>
              <div class="thread-compose"><div class="small-avatar"><img id="avatarImageCompose" alt="" /></div><span>添加到串文</span><b><i data-lucide="image"></i><strong>GIF</strong><i data-lucide="expand"></i></b></div>
              <div class="thread-systembar"><span></span></div>
            </div>
          </article>
        </div>
      </div>
      <div class="stage-footer"><span id="dimensionLabel">1080 × 1440 · 3:4</span><span>自适应排版 · 适合小红书</span></div>
    </section>
  </main>
  <div class="toast" id="toast" role="status">图片已保存</div>
  <script src="https://unpkg.com/lucide@0.468.0/dist/umd/lucide.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/html2canvas@1.4.1/dist/html2canvas.min.js"></script>
  <script src="app.js"></script>
</body>
</html>
